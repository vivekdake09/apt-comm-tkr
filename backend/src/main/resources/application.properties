# Server Configuration
server.port=8080

# Database Configuration
# USER PROVIDED: database_host (default: localhost), database_port (default: 3306), database_name (default: apt_comm_db)
spring.datasource.url=jdbc:mysql://localhost:3306/apt_comm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# USER PROVIDED: database_user (default: root)
spring.datasource.username=root
# USER PROVIDED: database_password (default: password)
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Security & JWT Configuration
# HS256 key base64-encoded (Must be at least 256 bits)
# USER PROVIDED: jwt_secret_key
aptcomm.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token expiration time: 86400000 milliseconds = 24 hours
aptcomm.jwt.expiration-ms=86400000

# File Upload Limit (for any future attachment / scanner storage)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
